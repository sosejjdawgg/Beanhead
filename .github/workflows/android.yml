name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Bundle the page, 3D engine, face tracker and model into the app
        run: bash scripts/bundle-www.sh android/app/src/main/assets/www

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build APK
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Name the APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk PeanutCam.apk

      - uses: actions/upload-artifact@v4
        with:
          name: PeanutCam-apk
          path: PeanutCam.apk

      - name: Publish to Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest PeanutCam.apk \
            --title "Peanut Cam (latest build)" \
            --notes "Built from commit ${GITHUB_SHA::7}. On your Android phone, download PeanutCam.apk and open it to install." \
            --latest
