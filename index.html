<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0e0906">
<title>Peanut Cam</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: full-bleed 3D stage; menu sits over it; in a mode, a floating bottom bar and a short settings sheet */
:root{
  --bg:#0e0906;                     /* roasted black */
  --ink:#f7ecdc;                    /* paper cream */
  --mute:#b39a7e;                   /* husk */
  --faint:rgba(247,236,220,.07);
  --line:rgba(247,236,220,.12);
  --panel:rgba(24,15,10,.78);
  --panel2:rgba(28,18,12,.94);
  --raise:#2b1c12;
  --nut:#e3ad6b;                    /* accent: raw peanut */
  --nut2:#f6cf96;
  --ember:#ff8a4c;                  /* live / voice */
  --display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  --spring:cubic-bezier(.2,1.4,.4,1);
  --ease:cubic-bezier(.22,.8,.2,1);
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--display);-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;appearance:none;border:0;background:none;cursor:pointer;padding:0}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--nut);outline-offset:2px}
svg.i{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.press{transition:transform .35s var(--spring), background-color .2s, color .2s, opacity .2s}
.press:active{transform:scale(.93)}

#stage{position:fixed;inset:0;background:var(--bg);transition:background .5s}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block}

/* ---------- menu ---------- */
#menu{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;justify-content:space-between;
  padding:calc(22px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  background:linear-gradient(180deg, rgba(14,9,6,.55) 0%, rgba(14,9,6,0) 22%, rgba(14,9,6,0) 40%, rgba(14,9,6,.88) 64%, var(--bg) 100%)}
.m-top{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.m-title{margin:0;font-weight:800;font-size:clamp(46px,14vw,92px);line-height:.86;letter-spacing:-.035em;display:flex;gap:.18em}
.m-title span{display:inline-block}
.m-title .accent{color:var(--nut);font-style:italic;font-weight:600}
.m-title .ch{display:inline-block;animation:rise .9s var(--spring) both}
.m-sub{font:500 11px var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--mute);animation:fade 1s .5s both}
.m-cards{width:100%;max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.card{position:relative;border-radius:28px;overflow:hidden;text-align:left;color:var(--ink);isolation:isolate}
.card::before{content:"";position:absolute;inset:0;z-index:-1;opacity:0;transition:opacity .4s;
  background:radial-gradient(260px circle at var(--mx,70%) var(--my,30%), rgba(255,180,100,.22), transparent 60%)}
.card:hover::before,.card.lit::before{opacity:1}
.card.primary{display:grid;grid-template-columns:1fr auto;align-items:end;gap:4px 14px;width:100%;padding:18px 18px 18px 22px;
  background:linear-gradient(155deg,#4a2c18 0%,#2a190e 55%,#1e120a 100%);
  box-shadow:inset 0 0 0 1px rgba(246,207,150,.2), 0 24px 60px rgba(0,0,0,.5);animation:up .8s .15s var(--spring) both}
.card.primary::after{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;pointer-events:none;
  background:conic-gradient(from var(--a,0deg), transparent 0 70%, rgba(246,207,150,.85) 80%, transparent 90%);
  -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;animation:spin 5s linear infinite}
@property --a{syntax:"<angle>";inherits:false;initial-value:0deg}
@keyframes spin{to{--a:360deg}}
.tag{display:inline-flex;align-items:center;gap:6px;font:500 10px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--nut2);
  background:rgba(227,173,107,.14);padding:5px 9px;border-radius:99px;justify-self:start}
.tag i{width:6px;height:6px;border-radius:50%;background:var(--ember);box-shadow:0 0 0 0 rgba(255,138,76,.6);animation:ping 1.8s infinite}
.card .ttl{font-weight:800;font-size:40px;line-height:.95;letter-spacing:-.03em}
.card .dsc{color:var(--mute);font-size:14.5px;line-height:1.4;max-width:30ch}
.card.primary .ttl,.card.primary .dsc,.card.primary .tag{grid-column:1}
.go{grid-column:2;grid-row:2/span 2;width:64px;height:64px;border-radius:22px;background:var(--nut);color:#1d1109;display:grid;place-items:center;
  box-shadow:0 10px 30px rgba(227,173,107,.35);transition:transform .45s var(--spring)}
.card.primary:active .go{transform:scale(.9) rotate(-8deg)}
.go svg{width:28px;height:28px;stroke-width:2.2}
.card.second{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:2px 14px;align-items:center;padding:12px;
  background:rgba(30,19,12,.82);backdrop-filter:blur(14px);box-shadow:inset 0 0 0 1px var(--line);animation:up .8s .25s var(--spring) both}
.thumb{grid-row:1/span 2;grid-column:1;width:64px;height:64px;border-radius:18px;overflow:hidden;display:grid;place-items:center;color:var(--mute);
  background:conic-gradient(#2c1d13 25%,#24170f 0 50%,#2c1d13 0 75%,#24170f 0) 0 0/16px 16px}
.thumb img{width:100%;height:100%;object-fit:contain}
.second .ttl{grid-column:2;align-self:end;font-size:21px;font-weight:800;letter-spacing:-.02em}
.second .dsc{grid-column:2;align-self:start;font-size:13px;line-height:1.35;max-width:none}
.acts{grid-column:3;grid-row:1/span 2;display:flex;flex-direction:column;gap:6px}
.acts .pill{flex:none;height:44px;padding:0 16px;font-size:14px}
.acts .pill.small{height:34px;font-size:12.5px;color:var(--mute);background:transparent;box-shadow:inset 0 0 0 1px var(--line)}
.pill{flex:1;height:46px;border-radius:15px;font-weight:600;font-size:15px;display:flex;align-items:center;justify-content:center;gap:8px;background:var(--raise);color:var(--ink)}
.pill.hot{background:var(--ink);color:#1d1109}
.m-foot{display:flex;justify-content:center;gap:8px;align-items:center;color:var(--mute);font-size:12.5px;margin:2px 0 0;animation:fade 1s .6s both}
#status{min-height:20px;text-align:center;font:500 13px/1.45 var(--mono);color:var(--nut2)}
body:not([data-mode=menu]) #menu{pointer-events:none}
body:not([data-mode=menu]) #menu .m-top{transform:translateY(-40px);opacity:0}
body:not([data-mode=menu]) #menu .m-cards{transform:translateY(60px);opacity:0}
body:not([data-mode=menu]) #menu{background:transparent}
#menu,.m-top,.m-cards{transition:transform .55s var(--ease), opacity .4s, background .5s}

/* ---------- HUD ---------- */
#hud{position:fixed;inset:0;z-index:10;pointer-events:none;opacity:0;transition:opacity .4s .1s}
body[data-mode=peanut] #hud,body[data-mode=puppet] #hud{opacity:1}
body[data-mode=menu] #hud *{pointer-events:none!important}
#hud > *{pointer-events:auto}
.fab{position:absolute;height:46px;padding:0 16px 0 12px;border-radius:16px;display:flex;align-items:center;gap:6px;font-weight:600;font-size:15px;
  background:var(--panel);backdrop-filter:blur(16px) saturate(1.3);box-shadow:inset 0 0 0 1px var(--line), 0 8px 24px rgba(0,0,0,.35)}
#bHome{top:calc(14px + env(safe-area-inset-top,0px));left:calc(14px + env(safe-area-inset-left,0px))}
#pip{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));right:calc(14px + env(safe-area-inset-right,0px));width:min(24vw,140px);aspect-ratio:3/4;object-fit:cover;
  border-radius:16px;background:#000;box-shadow:inset 0 0 0 1px var(--line), 0 10px 30px rgba(0,0,0,.45)}
#pip.mirror{transform:scaleX(-1)}
#chip{position:absolute;left:50%;top:calc(76px + env(safe-area-inset-top,0px));transform:translateX(-50%);display:flex;align-items:center;gap:8px;white-space:nowrap;
  font:500 12px var(--mono);letter-spacing:.06em;text-transform:uppercase;padding:9px 14px;border-radius:99px;background:var(--panel);color:var(--nut2);backdrop-filter:blur(10px)}
#chip::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--ember);animation:ping 1.6s infinite}
#bar{position:absolute;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:flex;gap:2px;padding:6px;border-radius:24px;
  background:var(--panel);backdrop-filter:blur(18px) saturate(1.4);box-shadow:inset 0 0 0 1px var(--line), 0 14px 40px rgba(0,0,0,.45);transition:transform .45s var(--spring), opacity .3s}
body.sheet-open #bar{transform:translate(-50%,140%);opacity:0}
.bb{width:60px;height:56px;border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:10.5px;font-weight:600;color:var(--mute);position:relative}
.bb:hover{color:var(--ink)}
.bb.on{color:var(--nut2);background:rgba(227,173,107,.13)}
.puppet-only{display:none!important}
body[data-mode=puppet] .puppet-only{display:flex!important}
.clean #hud{opacity:0!important}
.clean #hud *{pointer-events:none!important}

/* ---------- settings sheet ---------- */
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:20;height:min(46vh,430px);display:flex;flex-direction:column;
  background:var(--panel2);backdrop-filter:blur(22px) saturate(1.3);border-radius:28px 28px 0 0;box-shadow:0 -1px 0 var(--line), 0 -18px 50px rgba(0,0,0,.45);
  transform:translateY(calc(100% + 24px));transition:transform .5s var(--spring);padding-bottom:env(safe-area-inset-bottom,0px)}
#sheet.open{transform:translateY(0)}
#sheet.dragging{transition:none}
@media (min-width:900px){
  #sheet{left:auto;right:16px;bottom:16px;top:16px;height:auto;width:380px;border-radius:26px;transform:translateX(calc(100% + 40px))}
  #sheet.open{transform:none}
  body.sheet-open #bar{transform:translateX(-50%);opacity:1}
}
.sh-grab{height:22px;display:grid;place-items:center;cursor:grab;touch-action:none;flex:none}
.sh-grab::before{content:"";width:44px;height:5px;border-radius:5px;background:var(--line)}
.sh-head{display:flex;gap:8px;align-items:center;padding:0 max(14px,env(safe-area-inset-right,0px)) 10px max(14px,env(safe-area-inset-left,0px));flex:none}
.seg{flex:1;display:flex;gap:2px;padding:4px;border-radius:16px;background:rgba(0,0,0,.28);overflow-x:auto;scrollbar-width:none}
.seg button{flex:1;min-width:58px;height:44px;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:10.5px;font-weight:600;color:var(--mute);transition:background .25s,color .25s}
.seg button svg{width:18px;height:18px}
.seg button[aria-selected=true]{background:var(--raise);color:var(--nut2);box-shadow:inset 0 0 0 1px var(--line)}
.sh-x{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:rgba(0,0,0,.28);color:var(--mute);flex:none}
#shBody{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:2px max(18px,env(safe-area-inset-right,0px)) 18px max(18px,env(safe-area-inset-left,0px));-webkit-overflow-scrolling:touch}
#shBody.swap > *{animation:slidein .4s var(--ease) both}
#shBody.swap > *:nth-child(2){animation-delay:.03s}#shBody.swap > *:nth-child(3){animation-delay:.06s}#shBody.swap > *:nth-child(4){animation-delay:.09s}#shBody.swap > *:nth-child(n+5){animation-delay:.12s}
.sec{font:500 10.5px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--mute);padding:16px 0 6px}
.srow{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;column-gap:10px;min-height:54px;border-bottom:1px solid var(--faint)}
.slabel{font-size:15px;line-height:1.25}
.sctl{display:flex;align-items:center;gap:4px}
.step{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;background:var(--raise);color:var(--ink)}
.step svg{width:18px;height:18px;stroke-width:2.2}
.sval{min-width:66px;height:40px;padding:0 8px;border-radius:13px;font:500 13.5px var(--mono);color:var(--nut2);font-variant-numeric:tabular-nums;transition:background .2s}
.sval[aria-expanded=true]{background:rgba(227,173,107,.16)}
.sval.pop{animation:pop .3s var(--spring)}
.scrub{grid-column:1/-1;display:grid;grid-template-rows:0fr;transition:grid-template-rows .35s var(--ease)}
.scrub.open{grid-template-rows:1fr}
.scrub > div{overflow:hidden}
.track{position:relative;height:44px;margin:4px 0 12px;border-radius:14px;background:var(--raise);overflow:hidden;touch-action:pan-y;cursor:ew-resize}
.track::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 calc(10% - 1px),rgba(247,236,220,.1) calc(10% - 1px) 10%)}
.fill{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,rgba(227,173,107,.25),rgba(246,207,150,.55))}
.fill::after{content:"";position:absolute;right:0;top:8px;bottom:8px;width:4px;border-radius:4px;background:var(--ink);box-shadow:0 0 12px rgba(246,207,150,.8)}
.track span{position:absolute;inset:0;display:grid;place-items:center;font:500 10.5px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:rgba(247,236,220,.45);pointer-events:none}
.switch{width:54px;height:34px;border-radius:99px;background:var(--raise);position:relative;transition:background .25s;flex:none}
.switch::after{content:"";position:absolute;top:4px;left:4px;width:26px;height:26px;border-radius:50%;background:var(--mute);transition:transform .45s var(--spring),background .25s}
.switch[aria-checked=true]{background:var(--nut)}
.switch[aria-checked=true]::after{transform:translateX(20px);background:#1d1109}
.chips{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:8px;padding:2px 0 14px}
.chip{height:42px;padding:0 15px;border-radius:13px;background:var(--raise);font-weight:600;font-size:14px;display:flex;align-items:center;gap:8px}
.chip[aria-pressed=true]{background:var(--nut);color:#1d1109}
.chip .dot{width:16px;height:16px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.3)}
.swatches{display:flex;gap:10px;overflow-x:auto;padding:4px 2px 14px;scrollbar-width:none;margin:0 -2px}
.sw{flex:none;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11px;font-weight:600;color:var(--mute)}
.sw i{width:58px;height:58px;border-radius:18px;display:block;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08);transition:transform .4s var(--spring), box-shadow .2s;position:relative;overflow:hidden}
.sw[aria-pressed=true]{color:var(--nut2)}
.sw[aria-pressed=true] i{box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--nut);transform:scale(.94)}
.sw input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
.btnrow{display:flex;gap:8px;padding:12px 0 6px}
.btnrow .pill{height:48px}
select.sel{width:100%;height:48px;margin:12px 0 4px;border-radius:14px;border:0;padding:0 14px;background:var(--raise);color:var(--ink);font:500 14px var(--display)}
.note{color:var(--mute);font-size:13px;line-height:1.5;margin:12px 0 4px}
.danger{color:#ffb39a}

/* ---------- layout editor ---------- */
#editor{position:fixed;inset:0;z-index:25;pointer-events:none}
#editor .h{position:absolute;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;pointer-events:auto;touch-action:none;cursor:grab;
  border:2px solid var(--nut2);background:rgba(227,173,107,.18);box-shadow:0 0 0 1px rgba(0,0,0,.4), 0 4px 14px rgba(0,0,0,.4);transition:transform .3s var(--spring)}
#editor .h::before{content:"";position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px;border-radius:50%;background:var(--ink)}
#editor .h::after{content:attr(data-label);position:absolute;left:50%;top:100%;transform:translate(-50%,4px);padding:2px 7px;border-radius:99px;background:rgba(14,9,6,.8);font:600 10.5px var(--display);color:var(--ink);white-space:nowrap}
#editor .h.mouth{border-color:var(--ember);background:rgba(255,138,76,.18)}
#editor .h.grab{transform:scale(1.25)}
#editor .edbar{position:absolute;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:min(520px,calc(100% - 32px));pointer-events:auto;
  display:flex;gap:12px;align-items:center;padding:12px 12px 12px 18px;border-radius:22px;background:var(--panel2);box-shadow:inset 0 0 0 1px var(--line),0 14px 40px rgba(0,0,0,.5);font-size:13.5px;line-height:1.4;color:var(--mute)}
#editor .edbar .pill{flex:none;padding:0 22px}

/* ---------- toast, busy ---------- */
#toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));z-index:50;transform:translate(-50%,-140%);max-width:calc(100% - 32px);
  padding:12px 18px;border-radius:16px;background:var(--ink);color:#1d1109;font-weight:600;font-size:14px;line-height:1.35;box-shadow:0 12px 30px rgba(0,0,0,.4);transition:transform .5s var(--spring)}
#toast.show{transform:translate(-50%,0)}
#busy{position:fixed;inset:0;z-index:60;display:grid;place-items:center;background:rgba(14,9,6,.72);backdrop-filter:blur(10px);opacity:0;pointer-events:none;transition:opacity .3s}
#busy.show{opacity:1;pointer-events:auto}
#busy .bx{display:flex;flex-direction:column;align-items:center;gap:16px;font-weight:600;font-size:16px}
#busy svg{width:64px;height:64px;animation:wob 1.1s var(--ease) infinite}
@keyframes rise{from{transform:translateY(.6em) rotate(6deg);opacity:0}}
@keyframes up{from{transform:translateY(40px);opacity:0}}
@keyframes fade{from{opacity:0}}
@keyframes pop{40%{transform:scale(1.18)}}
@keyframes slidein{from{transform:translateY(10px);opacity:0}}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(255,138,76,.55)}80%,100%{box-shadow:0 0 0 8px rgba(255,138,76,0)}}
@keyframes wob{0%,100%{transform:rotate(-14deg)}50%{transform:rotate(14deg) translateY(-6px)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>
<script>
/* Loader: picks bundled files inside the Android app, CDN on the web, and reports any failure on screen */
(function(){
  var local = location.hostname === "appassets.androidplatform.net" || /^(localhost|127\.0\.0\.1)$/.test(location.hostname);
  var abs = function(p){ return new URL(p, location.href).href; };
  var PC = window.PC = {
    local: local, ready: false,
    three: local ? abs("./lib/three/") : "https://cdn.jsdelivr.net/npm/three@0.160.0/",
    mp: local ? abs("./lib/tasks-vision") : "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14",
    model: local ? abs("./models/face_landmarker.task") : "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task",
    seg: local ? abs("./models/selfie_segmenter.tflite") : "https://storage.googleapis.com/mediapipe-models/image_segmenter/selfie_segmenter/float16/latest/selfie_segmenter.tflite"
  };
  var im = document.createElement("script");
  im.type = "importmap";
  im.textContent = JSON.stringify({imports:{"three":PC.three + "build/three.module.js", "three/addons/":PC.three + "examples/jsm/"}});
  document.currentScript.after(im);

  PC.say = function(msg){
    if (document.body && document.body.dataset.mode === "menu"){ var st = document.getElementById("status"); if (st) st.textContent = msg; }
    else { var c = document.getElementById("chip"); if (c){ c.textContent = msg; c.hidden = false; } }
  };
  addEventListener("error", function(e){
    var t = e.target;
    if (t && t !== window && t.tagName === "SCRIPT") PC.say("Couldn't load " + (t.src || "a script") + ". Check your internet connection and reload.");
    else if (e.message) PC.say("Error: " + e.message);
  }, true);
  addEventListener("unhandledrejection", function(e){ var r = e.reason; PC.say("Error: " + ((r && r.message) || r)); });
  addEventListener("DOMContentLoaded", function(){
    ["goPeanut","goPuppet"].forEach(function(id){
      var b = document.getElementById(id);
      b && b.addEventListener("click", function(){ if (!PC.ready) PC.say("Still loading. Give it a few seconds and tap again."); });
    });
    setTimeout(function(){ if (!PC.ready) PC.say("The 3D engine didn't load. Check your internet connection, then reload."); }, 20000);
  });
})();
</script>
</head>
<body data-mode="menu">

<svg width="0" height="0" style="position:absolute" aria-hidden="true">

<script type="module">
import * as THREE from "three";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";

const PC = window.PC, MP = PC.mp, MODEL = PC.model;
const $ = s => document.querySelector(s);
const clamp = THREE.MathUtils.clamp;

/* ---------- settings ---------- */
const DEFAULTS = {
  bg:"roastery", bgColor:"#1f6f4a", floor:true, zoom:1, light:1, roast:0.55, bump:1.4,
  motion:1, wobble:0.5, steady:0.5, bounce:true, invYaw:false, invPitch:false,
  eyeSize:1, eyeSpacing:0.36, eyeHeight:1.18, mouthSize:1, mouthHeight:0.5,
  eyeMargin:0.055, mouthMargin:0.045, feather:0.07, symFill:true, blend:0.15, depth:1.3, skinMatch:0.8, retouch:0.8,
  pEyeSize:1.15, pMouthSize:1.15, pBgRemove:true,
  mirror:true, pip_on:true, deviceId:"", facing:"user"
};
let S = {...DEFAULTS};
try{ Object.assign(S, JSON.parse(localStorage.getItem("peanutcam") || "{}")); }catch(e){}
const save = () => { try{ localStorage.setItem("peanutcam", JSON.stringify(S)); }catch(e){} };

/* ---------- small helpers: haptics, toast, busy ---------- */
const buzz = ms => { try{ navigator.vibrate && navigator.vibrate(ms); }catch(e){} };
let toastT;
function toast(msg, ms = 2800){ const t = $("#toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("show"), ms); }
function busy(msg){ $("#busyMsg").textContent = msg || ""; $("#busy").classList.toggle("show", !!msg); }
const withTimeout = (p, ms, msg) => Promise.race([p, new Promise((_, rej) => setTimeout(() => rej(new Error(msg)), ms))]);
const nextFrame = () => new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));

/* ---------- three.js scene ---------- */
const canvas = $("#gl");
const renderer = new THREE.WebGLRenderer({canvas, antialias:true, alpha:true});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.setClearColor(0x000000, 0);
const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
const camera = new THREE.PerspectiveCamera(32, 1, 0.1, 100);
const hemi = new THREE.HemisphereLight(0xfff1dc, 0x3a2514, 0.6);
const key = new THREE.DirectionalLight(0xffe2b8, 2.2); key.position.set(3, 4, 5);
const rim = new THREE.DirectionalLight(0xffb070, 1.4); rim.position.set(-4, 2, -3);
scene.add(hemi, key, rim);

/* ---------- peanut ---------- */
const H = 1.95;
function radiusAt(y){
  const t = y / H; if (Math.abs(t) >= 1) return 0;
  const base = Math.pow(1 - t*t, 0.42);
  const waist = 1 - 0.28 * Math.exp(-(y*y) / 0.25);
  return base * waist * (y > 0 ? 0.95 : 1.0);
}
function disp(phi, y){ return 1 + 0.022*Math.sin(3*phi + 2.1*y) + 0.018*Math.sin(5*y + 1.3)*Math.cos(2*phi); }
function makePeanutGeometry(){
  const pts = [];
  for (let i = 0; i <= 140; i++){ const y = -H + 2*H*i/140; pts.push(new THREE.Vector2(Math.max(radiusAt(y), 0.0001), y)); }
  const g = new THREE.LatheGeometry(pts, 120, Math.PI, Math.PI*2);
  const p = g.attributes.position;
  for (let i = 0; i < p.count; i++){
    const x = p.getX(i), y = p.getY(i), z = p.getZ(i), f = disp(Math.atan2(x, z), y);
    p.setXYZ(i, x*f, y, z*f);
  }
  g.computeVertexNormals();
  return g;
}
function lerpColor(a, b, t){ return a.map((v,i)=>Math.round(v + (b[i]-v)*t)); }
function rgb(c, a=1){ return `rgba(${c[0]},${c[1]},${c[2]},${a})`; }
function makeShell(roast){
  const W = 1024, Hh = 1024;
  const c = document.createElement("canvas"); c.width = W; c.height = Hh;
  const b = document.createElement("canvas"); b.width = W; b.height = Hh;
  const cx = c.getContext("2d"), bx = b.getContext("2d");
  const pit = lerpColor([196,150,96],[58,34,18],roast), ridge = lerpColor([232,196,142],[104,66,38],roast);
  let seed = 7; const rnd = () => ((seed = (seed*16807) % 2147483647) / 2147483647);
  cx.fillStyle = rgb(pit); cx.fillRect(0,0,W,Hh);
  bx.fillStyle = "#5a5a5a"; bx.fillRect(0,0,W,Hh);
  for (let i = 0; i < 500; i++){
    const x = rnd()*W, y = rnd()*Hh, r = 10 + rnd()*60, g = cx.createRadialGradient(x,y,0,x,y,r);
    g.addColorStop(0, rnd() > 0.5 ? "rgba(255,230,190,.10)" : "rgba(30,15,5,.12)"); g.addColorStop(1,"rgba(0,0,0,0)");
    cx.fillStyle = g; cx.fillRect(x-r,y-r,2*r,2*r);
  }
  const R = 18, ridgeX = [];
  for (let i = 0; i < R; i++){
    const base = (i + 0.5) * W / R, ph = rnd()*6.28, amp = 6 + rnd()*10;
    ridgeX.push(v => base + Math.sin(v*0.018 + ph)*amp + Math.sin(v*0.05 + ph*2)*3);
  }
  const strokeBoth = (path, w) => {
    for (const off of [-W, 0, W]){
      cx.save(); cx.translate(off,0); cx.strokeStyle = rgb(ridge,.95); cx.lineWidth = w; cx.lineCap = "round"; cx.stroke(path); cx.restore();
      bx.save(); bx.translate(off,0); bx.strokeStyle = "#e8e8e8"; bx.lineWidth = w+2; bx.lineCap = "round"; bx.stroke(path); bx.restore();
    }
  };
  for (const fx of ridgeX){ const p = new Path2D(); p.moveTo(fx(0), 0); for (let v = 8; v <= Hh; v += 8) p.lineTo(fx(v), v); strokeBoth(p, 7); }
  for (let i = 0; i < R; i++){
    const a = ridgeX[i], bb = ridgeX[(i+1)%R], wrap = i === R-1 ? W : 0;
    let v = rnd()*40;
    while (v < Hh){
      const v2 = v + (rnd()-0.5)*36, p = new Path2D();
      p.moveTo(a(v), v); p.quadraticCurveTo((a(v)+bb(v2)+wrap)/2, (v+v2)/2 + (rnd()-0.5)*14, bb(v2)+wrap, v2);
      strokeBoth(p, 4 + rnd()*2); v += 34 + rnd()*40;
    }
  }
  if (roast > 0.05){
    for (let i = 0; i < 160*roast; i++){
      const y = rnd() < 0.5 ? rnd()*Hh*0.25 : Hh - rnd()*Hh*0.25, yy = rnd() < 0.6 ? y : rnd()*Hh;
      const x = rnd()*W, r = 20 + rnd()*90, g = cx.createRadialGradient(x,yy,0,x,yy,r);
      g.addColorStop(0, `rgba(18,8,2,${0.35*roast})`); g.addColorStop(1,"rgba(0,0,0,0)");
      cx.fillStyle = g; cx.fillRect(x-r,yy-r,2*r,2*r);
    }
  }
  const map = new THREE.CanvasTexture(c); map.colorSpace = THREE.SRGBColorSpace; map.wrapS = THREE.RepeatWrapping; map.anisotropy = 4;
  const b2 = document.createElement("canvas"); b2.width = W; b2.height = Hh;
  const b2x = b2.getContext("2d"); b2x.filter = "blur(2px)"; b2x.drawImage(b, 0, 0);
  const bump = new THREE.CanvasTexture(b2); bump.wrapS = THREE.RepeatWrapping;
  return {map, bump};
}
const nutMat = new THREE.MeshStandardMaterial({roughness:0.82, metalness:0, envMapIntensity:0.6});
function applyShell(){
  const {map, bump} = makeShell(S.roast);
  nutMat.map?.dispose(); nutMat.bumpMap?.dispose();
  nutMat.map = map; nutMat.bumpMap = bump; nutMat.bumpScale = S.bump; nutMat.needsUpdate = true;
}
const rig = new THREE.Group(), nut = new THREE.Group();
rig.add(nut); scene.add(rig);
nut.add(new THREE.Mesh(makePeanutGeometry(), nutMat));
const shadowTex = (() => { const c = document.createElement("canvas"); c.width = c.height = 256; const x = c.getContext("2d");
  const g = x.createRadialGradient(128,128,0,128,128,128); g.addColorStop(0,"rgba(0,0,0,.55)"); g.addColorStop(1,"rgba(0,0,0,0)");
  x.fillStyle = g; x.fillRect(0,0,256,256); return new THREE.CanvasTexture(c); })();
const floor = new THREE.Mesh(new THREE.PlaneGeometry(3.2, 3.2), new THREE.MeshBasicMaterial({map:shadowTex, transparent:true, depthWrite:false}));
floor.rotation.x = -Math.PI/2; floor.position.y = -H - 0.12; rig.add(floor);

/* ---------- puppet (2D picture) ---------- */
const PUP_H = 3.5;
const puppet = new THREE.Group(); puppet.visible = false; scene.add(puppet);
const pBody = new THREE.Group(); puppet.add(pBody);
let PUP = null;                      // {canvas, meta, s, tint, png, original, meshes}
function buildPuppet(){
  if (PUP.meshes) for (const m of PUP.meshes){ m.parent?.remove(m); m.geometry.dispose(); m.material.map?.dispose(); m.material.dispose(); }
  const cv = PUP.canvas, w = cv.width, h = cv.height, s = PUP_H / h;
  PUP.s = s;
  const tex = new THREE.CanvasTexture(cv); tex.colorSpace = THREE.SRGBColorSpace; tex.anisotropy = 4;
  const pic = new THREE.Mesh(new THREE.PlaneGeometry(w*s, PUP_H), new THREE.MeshBasicMaterial({map:tex, transparent:true, toneMapped:false, alphaTest:0.02}));
  pic.renderOrder = 1;
  pBody.add(pic);
  PUP.meshes = [pic];
}
const pxToWorld = (p) => PUP ? [(p[0] - PUP.canvas.width/2) * PUP.s, (PUP.canvas.height/2 - p[1]) * PUP.s] : [0, 0];

/* ---------- face features ----------
   Each feature is a ring mesh built from face landmarks: centre -> contour -> skin rings -> feathered edge.
   Texture coordinates come from the camera frame; positions come from a "frontalised" copy of the
   landmarks, so a feature keeps its size when you open your mouth, lean in or turn your head. */
const LM = {
  eyeR: [33,7,163,144,145,153,154,155,133,173,157,158,159,160,161,246],
  eyeL: [263,249,390,373,374,380,381,382,362,398,384,385,386,387,388,466],
  lipsOut: [61,146,91,181,84,17,314,405,321,375,291,409,270,269,267,0,37,39,40,185],
  lipsIn:  [78,95,88,178,87,14,317,402,318,324,308,415,310,311,312,13,82,81,80,191],
};
const LIP_MIRROR = i => (30 - i) % 20;
const LIP_SIDE = i => (i === 5 || i === 15) ? 0 : (i >= 6 && i <= 14 ? 1 : -1);
const tintU = { value: new THREE.Color(0.6, 0.45, 0.3) };
const shellTint = new THREE.Color();
function updateTint(){
  const t = S.roast, pit = [196,150,96].map((v,i)=>v + ([58,34,18][i]-v)*t), ridge = [232,196,142].map((v,i)=>v + ([104,66,38][i]-v)*t);
  shellTint.setRGB((pit[0]+ridge[0])/510, (pit[1]+ridge[1])/510, (pit[2]+ridge[2])/510);
  if (stageMode === "peanut") tintU.value.copy(shellTint);
}
const frameCanvas = document.createElement("canvas"); frameCanvas.width = frameCanvas.height = 2;
const frameCtx = frameCanvas.getContext("2d", {alpha:false});
const videoTex = new THREE.CanvasTexture(frameCanvas);
videoTex.minFilter = THREE.LinearFilter; videoTex.magFilter = THREE.LinearFilter; videoTex.generateMipmaps = false;
const texelU = { value: new THREE.Vector2(1/1280, 1/720) };
function featureMaterial(){
  return new THREE.ShaderMaterial({
    transparent:true, depthWrite:false, side:THREE.DoubleSide,
    polygonOffset:true, polygonOffsetFactor:-4, polygonOffsetUnits:-4,
    uniforms:{ map:{value:videoTex}, opacity:{value:0}, blend:{value:S.blend}, skinMatch:{value:S.skinMatch},
      relief:{value:1}, smoothSkin:{value:0.8}, tint:tintU, texel:texelU, light:{value:1} },
    vertexShader:`
      attribute float alpha; attribute float core; attribute vec3 snormal;
      varying float vA; varying float vCore; varying vec2 vUv; varying vec3 vN; varying vec3 vS; varying vec3 vV;
      void main(){
        vA = alpha; vCore = core; vUv = uv;
        vN = normalMatrix * normal; vS = normalMatrix * snormal;
        vec4 mv = modelViewMatrix * vec4(position, 1.0);
        vV = -mv.xyz;
        gl_Position = projectionMatrix * mv;
      }`,
    fragmentShader:`
      uniform sampler2D map; uniform float opacity, blend, skinMatch, relief, smoothSkin, light;
      uniform vec3 tint; uniform vec2 texel;
      varying float vA; varying float vCore; varying vec2 vUv; varying vec3 vN; varying vec3 vS; varying vec3 vV;
      vec3 retouch(vec2 uv, float amt){
        vec3 c0 = texture2D(map, uv).rgb;
        if (amt < 0.02) return c0;
        vec3 acc = c0; float ws = 1.0;
        for (int i = 0; i < 8; i++){
          float a = float(i) * 0.7853982;
          vec3 c = texture2D(map, uv + vec2(cos(a), sin(a)) * texel * 3.0).rgb;
          float w = exp(-dot(c - c0, c - c0) * 80.0);
          acc += c * w; ws += w;
        }
        return mix(c0, acc / ws, amt);
      }
      void main(){
        float skin = 1.0 - vCore;
        vec3 c = retouch(vUv, skin * smoothSkin);
        float l = dot(c, vec3(0.299, 0.587, 0.114));
        float tl = max(dot(tint, vec3(0.299, 0.587, 0.114)), 0.001);
        vec3 graded = tint * (l / tl) * 1.04;
        vec3 col = mix(c, graded, mix(blend * 0.45, skinMatch, skin));
        vec3 L = normalize(vec3(0.42, 0.57, 0.71));
        vec3 s = normalize(vS), n = normalize(vN);
        if (dot(n, s) < 0.0) n = -n;
        float dn = 0.28 + 0.72 * max(dot(n, L), 0.0), ds = 0.28 + 0.72 * max(dot(s, L), 0.0);
        col *= mix(1.0, clamp(dn / ds, 0.5, 1.6), relief);
        col *= mix(1.0, ds, 0.45) * mix(1.0, light, 0.35);
        float spec = pow(max(dot(reflect(-L, n), normalize(vV)), 0.0), 30.0);
        col += spec * 0.18 * vCore * relief;
        float inFrame = step(0.0, vUv.x) * step(vUv.x, 1.0) * step(0.0, vUv.y) * step(vUv.y, 1.0);
        gl_FragColor = vec4(col, smoothstep(0.0, 1.0, vA) * opacity * inFrame);
      }`
  });
}
function makeFeatureMesh(N, ringAlphas, ringCores, order, lipStrip){
  const nv = 1 + N * ringAlphas.length, g = new THREE.BufferGeometry();
  g.setAttribute("position", new THREE.BufferAttribute(new Float32Array(nv*3), 3).setUsage(THREE.DynamicDrawUsage));
  g.setAttribute("normal", new THREE.BufferAttribute(new Float32Array(nv*3), 3).setUsage(THREE.DynamicDrawUsage));
  g.setAttribute("uv", new THREE.BufferAttribute(new Float32Array(nv*2), 2).setUsage(THREE.DynamicDrawUsage));
  g.setAttribute("snormal", new THREE.BufferAttribute(new Float32Array(nv*3), 3).setUsage(THREE.DynamicDrawUsage));
  const al = new Float32Array(nv), co = new Float32Array(nv); al[0] = 1; co[0] = 1;
  ringAlphas.forEach((a, r) => { for (let i = 0; i < N; i++) al[1 + r*N + i] = a; });
  ringCores.forEach((c, r) => { for (let i = 0; i < N; i++) co[1 + r*N + i] = c; });
  g.setAttribute("alpha", new THREE.BufferAttribute(al, 1));
  g.setAttribute("core", new THREE.BufferAttribute(co, 1));
  const idx = [];
  if (lipStrip){
    const up = i => (N - i) % N;
    for (let i = 0; i < N/2; i++){ const a = 1+i, b = 1+i+1, c = 1+up(i+1), d = 1+up(i); idx.push(a, b, c); if (i > 0) idx.push(a, c, d); }
  } else {
    for (let i = 0; i < N; i++){ const j = (i+1)%N; idx.push(0, 1+i, 1+j); }
  }
  for (let r = 0; r < ringAlphas.length - 1; r++){
    for (let i = 0; i < N; i++){
      const j = (i+1)%N, a = 1 + r*N + i, b = 1 + r*N + j, c = 1 + (r+1)*N + i, d = 1 + (r+1)*N + j;
      idx.push(a, c, b, b, c, d);
    }
  }

// card glow follows the finger
for (const c of document.querySelectorAll(".card")){
  c.addEventListener("pointermove", e => { const r = c.getBoundingClientRect(); c.style.setProperty("--mx", (e.clientX - r.left) + "px"); c.style.setProperty("--my", (e.clientY - r.top) + "px"); c.classList.add("lit"); });
  c.addEventListener("pointerleave", () => c.classList.remove("lit"));
}
// title letters drop in one by one
for (const [id, d0] of [["tw1", 0], ["tw2", 0.35]]){
  const e = $("#" + id), t = e.textContent; e.textContent = "";
  [...t].forEach((ch, i) => { const s = el("span", "ch", ch); s.style.animationDelay = (d0 + i*0.05) + "s"; e.append(s); });
}

/* ---------- physics + render loop ---------- */
const spr = {}; for (const k of ["pitch","yaw","roll","tx","ty","lean","jaw","menu"]) spr[k] = {p: k === "lean" || k === "menu" ? 1 : 0, v: 0};
function step(st, tgt, dt, k, zeta){ const c = 2*zeta*Math.sqrt(k); st.v += (k*(tgt - st.p) - c*st.v) * dt; st.p += st.v * dt; }
let lastT = 0;
function loop(now){
  requestAnimationFrame(loop);
  try{ track(now); }catch(e){ console.error(e); }
  const dt = Math.min(0.05, Math.max(0.001, (now - lastT) / 1000)); lastT = now;
  const seen = now - lastSeen < 600;
  faceVis += ((seen ? 1 : 0) - faceVis) * Math.min(1, dt * 8);
  chipEl.hidden = mode === "menu" || (seen && trackerOk) || !camOn;

  if (!seen){ for (const k of ["pitch","yaw","roll","tx","ty","jaw"]) target[k] *= 1 - Math.min(1, dt*1.5); target.lean += (1 - target.lean) * Math.min(1, dt*1.5); }
  const wob = S.wobble, k = 110 + 90*(1 - wob), zeta = 1 - 0.62*wob;
  for (let i = 0; i < 2; i++){
    const h = dt/2;
    for (const key of ["pitch","yaw","roll","tx","ty"]) step(spr[key], target[key], h, k, zeta);
    step(spr.lean, target.lean, h, 70, 0.8);
    step(spr.jaw, S.bounce ? target.jaw : 0, h, 260, 0.35 + 0.4*(1 - wob));
    step(spr.menu, mode === "menu" ? 1 : 0, h, 60, 0.85);
  }
  const mk = spr.menu.p;
  if (stageMode === "peanut"){
    const idle = (seen ? 0 : Math.sin(now/900) * 0.05) + mk * Math.sin(now/1600) * 0.35 * (seen ? 0.3 : 1);
    rig.rotation.set(spr.pitch.p, spr.yaw.p + idle, spr.roll.p);
    rig.position.set(spr.tx.p * (1 - mk), spr.ty.p * (1 - mk) + mk * MENU.y, 0);
    rig.scale.setScalar(spr.lean.p * (1 - mk) + MENU.s * mk);
    const sq = spr.jaw.p * 0.06 + clamp(spr.ty.v * 0.03, -0.04, 0.04) * wob;
    nut.scale.set(1 - sq*0.45, 1 + sq, 1 - sq*0.45);
    nut.rotation.set(-spr.pitch.v * 0.025 * wob, 0, -spr.yaw.v * 0.02 * wob - spr.tx.v * 0.05 * wob);
  } else if (PUP){
    if (editing){ pBody.position.set(0, 0, 0); pBody.rotation.set(0, 0, 0); pBody.scale.set(1, 1, 1); }
    else {
      pBody.rotation.set(spr.pitch.p * 0.25, spr.yaw.p * 0.35, spr.roll.p * 0.8);
      pBody.position.set(spr.tx.p * 0.8, spr.ty.p * 0.8, 0);
      pBody.scale.set(spr.lean.p, spr.lean.p, 1);
    }
  }
  const set = (m, o) => {
    const u = m.material.uniforms;
    u.opacity.value = o; u.blend.value = S.blend; u.skinMatch.value = S.skinMatch; u.relief.value = Math.min(1, S.depth); u.smoothSkin.value = S.retouch; u.light.value = S.light;
    m.visible = o > 0.003;
  };
  set(F_EYE.R.real, faceVis * (1 - W.eyeR)); set(F_EYE.R.alt, faceVis * W.eyeR);
  set(F_EYE.L.real, faceVis * (1 - W.eyeL)); set(F_EYE.L.alt, faceVis * W.eyeL);
  set(F_MOUTH.real, faceVis * (1 - W.mouth)); set(F_MOUTH.alt, faceVis * W.mouth);

  renderer.render(scene, camera);
  if (editing && PUP) placeEditor();
}

/* ---------- boot ---------- */
applyShell(); updateTint(); applyBg(); resize(); menuPose(); onChange("light"); syncPip();
document.fonts?.ready.then(menuPose); setTimeout(menuPose, 1200);
requestAnimationFrame(loop);
loadSavedPuppet();
PC.ready = true;
</script>
