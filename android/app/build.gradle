plugins {
    id 'com.android.application'
}

android {
    namespace 'com.beanhead.peanutcam'
    compileSdk 34

    defaultConfig {
        applicationId "com.beanhead.peanutcam"
        minSdk 26
        targetSdk 34
        versionCode 13
        versionName "4.3"
    }

    // Fixed test key so each new build installs over the previous one.
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
